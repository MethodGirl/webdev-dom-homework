<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div class="comment-header__name">Варвара Н.</div>
            <div class="comment-header__date">13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          required
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
          required
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";

    let formButton = document.querySelector(".add-form-button");
    let formComment = document.querySelector(".add-form-text");
    let formName = document.querySelector(".add-form-name");
    let commentsBox = document.querySelector(".comments");

    function getFormattedDate() {
      let now = new Date();
      let day = now.getDate() < 10 ? "0" + now.getDate() : now.getDate();
      let month =
        now.getMonth() + 1 < 10
          ? "0" + (now.getMonth() + 1)
          : now.getMonth() + 1;
      let year = now.getFullYear() % 100;
      let hours = now.getHours() < 10 ? "0" + now.getHours() : now.getHours();
      let minutes =
        now.getMinutes() < 10 ? "0" + now.getMinutes() : now.getMinutes();
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    formButton.addEventListener("click", () => {
      let commentValue = formComment.value;
      let nameValue = formName.value;

      if (nameValue === "" || commentValue === "") {
        alert("Введите полностью данные прежде чем отправлять комментарий :)");
        return;
      }

      let newCommentHtml = `
    <li class="comment">
      <div class="comment-header">
        <div class="comment-header__name">${nameValue}</div>
        <div class="comment-header__date">${getFormattedDate()}</div>
      </div>
      <div class="comment-body">
        <div class="comment-text">
          ${commentValue}
        </div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <span class="likes-counter">0</span>
          <button class="like-button"></button>
        </div>
      </div>
    </li>
  `;

      commentsBox.innerHTML = commentsBox.innerHTML + newCommentHtml;

      formComment.value = "";
      formName.value = "";
    });
  </script>
</html>
