<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments"></ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          required
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
          required
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    let formButton = document.querySelector(".add-form-button");
    let formComment = document.querySelector(".add-form-text");
    let formName = document.querySelector(".add-form-name");
    let commentsBox = document.querySelector(".comments");

    let comments = [
      {
        name: "Глеб Фокин",
        data: new Date(2022, 1, 12, 12, 18),
        text: "Это будет первый комментарий на этой странице",
        likesCounter: 3,
        isLiked: true,
      },
      {
        name: "Варвара Н.",
        data: new Date(13, 2, 22, 19, 22),
        text: "Мне нравится как оформлена эта страница! ❤",
        likesCounter: 75,
        isLiked: true,
      },
    ];

    function addLikeHandlers() {
      let likeButtons = document.querySelectorAll(".like-button");
      let likesCounter = document.querySelectorAll(".likes-counter");

      likeButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          let index = button.dataset.index;

          if (comments[index].isLiked === true) {
            comments[index].isLiked = false;
            comments[index].likesCounter--;
          } else {
            comments[index].isLiked = true;
            comments[index].likesCounter++;
          }

          renderComments();
        });
      });
    }

    function renderComments() {
      let commentElements = comments
        .map((comment, index) => {
          return `<li class="comment" data-id=${index}>
            <div class="comment-header">
              <div class="comment-header__name">${comment.name}</div>
              <div class="comment-header__date">${getFormattedDate(comment.data)}</div>
            </div>
            <div class="comment-body">
              <div class="comment-text">${comment.text}</div>
            </div>
            <div class="comment-footer">
              <div class="likes">
                <span class="likes-counter" >${comment.likesCounter}</span>
                <button class="like-button ${comment.isLiked ? "-active-like" : ""}" data-index=${index}></button>
              </div>
            </div>
          </li>`;
        })
        .join("");

      commentsBox.innerHTML = commentElements;
      copyCommentToForm();
      addLikeHandlers();
    }

    renderComments();

    function getFormattedDate(date) {
      let day = date.getDate() < 10 ? "0" + date.getDate() : date.getDate();
      let month =
        date.getMonth() + 1 < 10
          ? "0" + (date.getMonth() + 1)
          : date.getMonth() + 1;
      let year = date.getFullYear() % 100;
      let hours =
        date.getHours() < 10 ? "0" + date.getHours() : date.getHours();
      let minutes =
        date.getMinutes() < 10 ? "0" + date.getMinutes() : date.getMinutes();
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function filterText(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    formButton.addEventListener("click", () => {
      let commentValue = formComment.value;
      let nameValue = formName.value;

      if (nameValue === "" || commentValue === "") {
        alert("Введите полностью данные прежде чем отправлять комментарий :)");
        return;
      }

      let comment = {};

      comment.name = filterText(nameValue);
      comment.data = new Date();
      comment.text = filterText(commentValue);
      comment.likesCounter = 0;

      comments.push(comment);

      renderComments();

      formComment.value = "";
      formName.value = "";
    });

    function copyCommentToForm() {
      let commentsEl = document.querySelectorAll(".comment");

      for (let commentEl of commentsEl) {
        commentEl.addEventListener("click", () => {
          console.log(commentEl);
          let index = commentEl.dataset.id;

          formComment.value =
            "Ответ на комментарий: " +
            `${filterText(comments[index].text)}` +
            " Автор: " +
            `${filterText(comments[index].name)}`;
        });
      }
    }
  </script>
</html>
